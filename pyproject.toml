[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trackcount"
version = "0.1.0"
description = "Count distinct objects in video from a moving camera, from per-frame detections"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Yash Bitla" }]
dependencies = ["numpy>=1.26", "opencv-contrib-python-headless>=4.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
trackcount = "trackcount.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trackcount"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
